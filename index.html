<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ochihai Omuha — Software Engineering & Security</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --ink: #1d1f23;
      --muted: #5f6470;
      --line: #e3e1da;
      --accent: #2f5d62;
      --sans: 'Inter', system-ui, sans-serif;
      --serif: 'Fraunces', Georgia, serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17181b; --surface: #1f2126; --ink: #ecebe6;
        --muted: #9a9ea8; --line: #2e3137; --accent: #8cc4c9;
      }
    }

    :root[data-theme="dark"] {
      --bg: #17181b; --surface: #1f2126; --ink: #ecebe6;
      --muted: #9a9ea8; --line: #2e3137; --accent: #8cc4c9;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 500;
      margin: 28px 0 4px;
    }

    .role {
      color: var(--muted);
      margin: 0 0 14px;
    }

    .intro {
      max-width: 60ch;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="status-bar">
      <span id="sb-date"></span>
      <span class="sb-user">Ochihai Omuha</span>
      <span id="sb-time"></span>
    </div>

    <h1>Ochihai Omuha</h1>
    <p class="role">Computer Science, Mount Royal University</p>
    <p class="intro">
      I'm interested in software and technology, and I enjoy building practical
      systems that solve real problems. I care about keeping them secure and
      reliable.
    </p>
  </header>

  <section id="projects">
    <h2>Projects</h2>
  </section>

  <section id="experience">
    <h2>Experience</h2>
  </section>

  <section id="skills">
    <h2>Skills</h2>
  </section>

  <section id="contact">
    <h2>Contact</h2>
  </section>

  <footer>
    <p>&copy; 2026 Ochihai Omuha</p>
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("sb-date").textContent =
        now.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
      document.getElementById("sb-time").textContent =
        now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }
    updateClock();
    setInterval(updateClock, 30000);
  </script>
</body>
</html>
